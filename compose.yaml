services:
  app:
    build:
      context: .
      target: dev
    user: "1000:1000"
    ports:
      - "8080:8080"
    environment:
      APP_ENV: dev
      COMPOSER_HOME: /tmp/composer
      LOAD_FIXTURES: "1"
    volumes:
      - .:/app
    entrypoint: ["/app/docker/entrypoint.sh"]
    command: ["frankenphp", "run", "--config", "/app/docker/Caddyfile"]
    depends_on:
      db:
        condition: service_healthy
      db_test:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library"]
      interval: 2s
      timeout: 3s
      retries: 30

  db_test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: library_test
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library_test"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db_data:
